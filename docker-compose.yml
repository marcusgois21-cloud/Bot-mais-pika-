services:
  postgres:
    image: postgres:16-alpine
    container_name: obraia-postgres
    environment:
      POSTGRES_USER: obraia
      POSTGRES_PASSWORD: obraia
      POSTGRES_DB: obraia
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Migrations rodam em ordem alfabética na primeira subida do volume
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U obraia -d obraia"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: obraia-redis
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: obraia-api
    env_file: .env
    environment:
      DATABASE_URL: postgresql://obraia:obraia@postgres:5432/obraia
      REDIS_URL: redis://redis:6379
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - media_data:/app/uploads
    restart: unless-stopped

  # Processa a fila (áudio, imagem, extração). Escala separado da API:
  # docker compose up -d --scale worker=3
  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: obraia-worker
    command: ["node", "dist/worker.js"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql://obraia:obraia@postgres:5432/obraia
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - media_data:/app/uploads
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: obraia-web
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3000
    ports:
      - "3001:3000"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  media_data:
